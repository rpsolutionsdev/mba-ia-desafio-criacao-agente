[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora construído com Google ADK e FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
]

[project.scripts]
aurora-api = "aurora.cli:run_api"
aurora-reset = "aurora.cli:reset_data"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]
